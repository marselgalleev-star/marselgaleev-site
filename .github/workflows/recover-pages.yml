name: Cancel stalled Pages deployment
on:
  push:
    branches: [recovery/pages-20261110]
permissions:
  contents: read
  pages: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel timed-out deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/marselgalleev-star/marselgaleev-site/pages/deployments/14a150e9bb366ae1cdf139f8b2f5bab108ee37d9/cancel"
